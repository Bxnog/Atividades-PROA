<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        var numero = parseFloat(prompt("Digite um numero."))

        if(numero > 0){
            alert("O numero é positivo")
        } else if(numero < 0){
            alert("O numero é negativo")
        } else {
            alert("O numero é zero")
        }
    </script>
</head>
<body>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        var numeros = []

        for(i = 0; i < 4; i++){
            numeros.push(parseFloat(prompt(`Digite o ${i + 1}° numero.`)))
        }

        var maior = numeros[0]

        for(i = 1; i < numeros.length; i++){
            if(numeros[i] > maior){
                maior = numeros[i]
            }
        }

        alert(`Primeiro: ${numeros[0]}\nUltimo: ${numeros[3]}\nMaior: ${maior}`)
    </script>
</head>
<body>
</body>
</html>

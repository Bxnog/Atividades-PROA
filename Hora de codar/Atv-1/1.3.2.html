<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        var numero1 = parseFloat(prompt("Digite o primeiro valor."))
        var numero2 = parseFloat(prompt("Digite o segundo valor."))

        while(numero2 <= 0){
            numero2 = parseFloat(prompt("Digite o segundo valor novamente."))
        }

        alert(`Resultado da divisão: ${numero1 / numero2}`)
    </script>
</head>
<body>
</body>
</html>

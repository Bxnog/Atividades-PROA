<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        var numero1 = parseInt(prompt("Digite o primeiro inteiro."))
        var numero2 = parseInt(prompt("Digite o segundo inteiro."))

        var soma = 0
        var quantidade = 0

        for(i = numero1; i <= numero2; i++){
            soma += i
            quantidade++
        }

        alert(`Media: ${soma / quantidade}`)
    </script>
</head>
<body>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        var soma = 0

        for(i = 0; i < 6; i++){
            var nota = parseFloat(prompt(`Digite a ${i + 1}° nota.`))

            while(nota < 0 || nota > 10){
                nota = parseFloat(prompt("Nota invalida. Digite uma nota de 0 a 10."))
            }

            soma += nota
        }

        alert(`Media: ${soma / 6}`)
    </script>
</head>
<body>
</body>
</html>

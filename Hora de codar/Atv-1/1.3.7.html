<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        var numero = parseInt(prompt("Digite um valor maior que 0."))

        while(numero <= 0){
            numero = parseInt(prompt("Valor invalido. Digite um valor maior que 0."))
        }

        for(i = 1; i <= numero; i++){
            document.write(i + "<br>")
        }
    </script>
</head>
<body>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        var dentro = 0
        var fora = 0

        for(i = 0; i < 10; i++){
            var numero = parseFloat(prompt(`Digite o ${i + 1}° valor.`))

            if(numero >= 24 && numero <= 42){
                dentro++
            } else {
                fora++
            }
        }

        alert(`Dentro do intervalo: ${dentro}\nFora do intervalo: ${fora}`)
    </script>
</head>
<body>
</body>
</html>

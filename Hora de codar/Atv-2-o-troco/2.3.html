<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        var numero = -Infinity;
        for(i = 0; i < 3; i++){
            var numerot = parseInt(prompt(`Digite o ${i + 1}° numero.`))
            if( numerot > numero){
                numero = numerot
            }
        }
        alert(`Maior numero digitado: ${numero}`)
    </script>
</head>

</body>
</html>

<!DOCTYPE html>
<html>

<head>

	<script type="module">
		import { reservarQuarto } from "./reserva_quarto.js";
		import { cadastrarHospede } from "./cadastrar_hospede.js";
		import { abastecerCarro } from "./abastecimentoCarro.js";
		import { agendarEvento } from "./eventos.js";


		function inicio() {

			var escolha = parseInt(prompt('Selecione uma opção 1.) Reserva de Quartos 2.) Cadastro de Hóspedes 3.) Abastecimento de Carros 4.) Agendar Eventos 5.) Sair'));

			if (escolha === 1) {
				reservarQuarto();
				inicio()
			} else if (escolha === 2) {
				cadastrarHospede()
				inicio()
			} else if (escolha === 3) {
				abastecerCarro();
			} else if (escolha === 4) {
				agendarEvento();
			} else if (escolha === 5) {
				sair();
			} else {
				erro();
			}
		}

		function cadastro_hospedes() {
			alert('HOTEL {NOME DO HOTEL} - CADASTRO DE HÓSPEDES');
			inicio();
		}

		function abastecer_carros() {
			alert('HOTEL {NOME DO HOTEL} - ABASTECER');
			inicio();
		}

		function erro() {
			alert('Por favor, informe um número entre 1 e 4');
			inicio();
		}

		function sair() {
			var confirma = confirm('Você deseja sair?');
			if (confirma) {
				window.close();
			} else {
				inicio();
			}
		}



		inicio();
	</script>
</head>

<body>

</body>

</html>

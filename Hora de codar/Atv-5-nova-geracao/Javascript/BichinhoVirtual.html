<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BichinhoVirtual</title>
    <script>

        // Classe Principal (normalmente em um arquivo externo)
        class BichinhoVirtual {
            constructor(nome) {
                this.nome = nome;
                this.nivelDeFome = 50;
                this.nivelFelicidade = 50;
                this.cansaco = 0;
                this.idade = 0;
                this.vivo = true;
            }

            alimentar() {
                this.nivelDeFome -= 10;
                console.log(`${this.nome} foi alimentado. O nível de fome diminuiu.`);
            }

            brincar() {
                this.nivelFelicidade += 10;
                console.log(`${this.nome} está brincando e se sentindo mais feliz.`);
            }
            descansar() {
                this.cansaco -= 40;
                if (this.cansaco < 0) {
                    this.cansaco = 0;
                }
                if (this.cansaco != 0) { console.log(`${this.nome} está descansando e se sentindo mais feliz.`); }
                else if (this.cansaco == 0) { console.log(`${this.nome} esta pronto para brincar!`); }
            }

            verificarStatus() {
                alert(
                    `Status atual de ${this.nome}:\n` +
                    `Nível de fome: ${this.nivelDeFome}\n` +
                    `Nível de felicidade: ${this.nivelFelicidade}\n` +
                    `Nível de cansaço: ${this.cansaco}\n` +
                    `Idade: ${this.idade}`
                );
            }

            passarTempo() {
                this.nivelDeFome += 3;
                this.nivelFelicidade -= 3;
                this.cansaco += 10;
                this.idade += 1;
                this.derrota()
                console.log(`${this.nome} está ficando mais faminto com o passar do tempo.`);
                return true;
            }
            derrota() {

                if (this.nivelDeFome >= 100) {
                    console.log(`${this.nome} morreu de fome :(`);
                    this.vivo = false;
                }
                if (this.nivelFelicidade <= 0) {
                    console.log(`${this.nome} morreu de Tristeza :(`);
                    this.vivo = false;
                }
                if (this.cansaco >= 100) {
                    console.log(`${this.nome} morreu de Cansaço! :(`);
                    this.vivo = false;
                }
            }
        }
    </script>
    <script>

        // Programa Principal
        console.log("Bem-vindo ao Simulador de Animal de Estimação Virtual!");
        const nomePet = prompt("Digite o nome do seu animal de estimação:") || "Baltazar Guilherme Tenório";
        const pet = new BichinhoVirtual(nomePet);

        while (pet.vivo) {
            // alert(
            //     `Escolha uma ação:\n` +
            //     `1. Alimentar ${nomePet}\n` +
            //     `2. Brincar com ${nomePet}\n` +
            //     `3. Descansar ${nomePet}\n` +
            //     `4. Verificar o status de ${nomePet}\n` +
            //     `5. Sair`
            // );

            const escolha = Number(prompt(
                `Escolha uma ação:\n` +
                `1. Alimentar ${nomePet}\n` +
                `2. Brincar com ${nomePet}\n` +
                `3. Descansar ${nomePet}\n` +
                `4. Verificar o status de ${nomePet}\n` +
                `5. Sair`
            ));

            switch (escolha) {
                case 1:
                    pet.alimentar();
                    break;
                case 2:
                    pet.brincar();
                    break;
                case 3:
                    pet.descansar();
                    break;
                case 4:
                    pet.verificarStatus();
                    break;
                case 5:
                    console.log("Saindo do Simulador de Animal de Estimação Virtual. Adeus!");
                    break;
                default:
                    console.log("Escolha inválida. Tente novamente.");
                    continue;
            }

            if (escolha === 5) {
                break;
            }

            pet.passarTempo(); // Simula o tempo que passa após cada ação
            if (!pet.vivo) {
                console.log("O jogo acabou!");
                break;
            }
        }
    </script>
</head>

</body>

</html>
